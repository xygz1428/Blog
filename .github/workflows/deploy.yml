name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 只读代码，写 Pages，读 OIDC token
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的覆盖排队中的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 用 npm install 而不是 npm ci：
      # 本项目依赖树里含平台相关的可选依赖（@emnapi/*，来自 Astro 的图像处理链）。
      # 在 Windows 上生成的 lockfile 不含这些包在 Linux 下的实体条目，
      # npm ci 的严格同步校验会在 Linux runner 上直接报 "Missing ... from lock file"。
      # npm install 会按当前平台解析，代价是放弃 lockfile 的严格复现性。
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
